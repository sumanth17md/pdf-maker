<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5" />
            <stop offset="100%" stop-color="#7c3aed" />
        </linearGradient>
        <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#059669" />
        </linearGradient>
    </defs>
    
    <!-- Rounded App Icon Background -->
    <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
    
    <!-- White Document Body -->
    <path d="M20 14 H36 L46 24 V48 C46 50.2 44.2 52 42 52 H20 C17.8 52 16 50.2 16 48 V18 C16 15.8 17.8 14 20 14 Z" fill="#ffffff" opacity="0.95" />
    
    <!-- Folded Corner -->
    <path d="M36 14 V24 H46 Z" fill="#cbd5e1" />
    
    <!-- Document Text Lines -->
    <rect x="22" y="28" width="16" height="3" rx="1.5" fill="#4f46e5" opacity="0.8" />
    <rect x="22" y="34" width="20" height="3" rx="1.5" fill="#94a3b8" />
    
    <!-- "PDF" Badge -->
    <rect x="20" y="40" width="18" height="7" rx="2" fill="#ef4444" />
    <text x="29" y="45.5" font-family="system-ui, sans-serif" font-size="5" font-weight="900" fill="#ffffff" text-anchor="middle">PDF</text>
    
    <!-- Mini Green Security Shield (Bottom Right) -->
    <circle cx="48" cy="48" r="9" fill="#ffffff" />
    <path d="M48 42 L54 44.5 V48.5 C54 52 51.5 54.5 48 55.5 C44.5 54.5 42 52 42 48.5 V44.5 Z" fill="url(#shieldGrad)" />
    <!-- Checkmark inside Shield -->
    <path d="M45.5 48.5 L47.5 50.5 L51 46.5" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
